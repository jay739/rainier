; Rainier example skin: CPU / memory / disk monitor.
[Rainier]
Update=1000
BackgroundColor=20,22,30,190
CornerRadius=12
Padding=16

[Variables]
LabelColor=200,205,215
Accent=120,200,255

[MeasureCPU]
Measure=CPU

[MeasureRAM]
Measure=Memory
Type=Percent

[MeasureRAMUsed]
Measure=Memory
Type=Used

[MeasureDisk]
Measure=Disk
Drive=/
Type=Free

[MeterTitle]
Meter=String
Text=System
FontSize=14
StringStyle=Bold
FontColor=#Accent#

[MeterCPULabel]
Meter=String
MeasureName=MeasureCPU
Text=CPU  %1%
X=0r
Y=10R
FontSize=12
FontColor=#LabelColor#

[MeterCPUBar]
Meter=Bar
MeasureName=MeasureCPU
X=0r
Y=4R
W=180
H=6
BarColor=#Accent#
SolidColor=60,65,80,120

[MeterCPUGraph]
Meter=Line
MeasureName=MeasureCPU
X=0r
Y=6R
W=180
H=36
LineColor=#Accent#
SolidColor=40,44,58,120

[MeterRAMLabel]
Meter=String
MeasureName=MeasureRAM
MeasureName2=MeasureRAMUsed
Text=RAM  %1% ([MeasureRAMUsed])
X=0r
Y=10R
FontSize=12
FontColor=#LabelColor#

[MeterRAMBar]
Meter=Bar
MeasureName=MeasureRAM
X=0r
Y=4R
W=180
H=6
BarColor=170,140,255
SolidColor=60,65,80,120

[MeterDiskLabel]
Meter=String
MeasureName=MeasureDisk
Text=Disk free  %1
AutoScale=1
NumOfDecimals=1
X=0r
Y=10R
FontSize=12
FontColor=#LabelColor#
