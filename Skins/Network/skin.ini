; Rainier example skin: network throughput graph.
[Rainier]
Update=1000
BackgroundColor=20,22,30,190
CornerRadius=12
Padding=16

[MeasureIn]
Measure=Net
Type=In

[MeasureOut]
Measure=Net
Type=Out

[MeterTitle]
Meter=String
Text=Network
FontSize=14
StringStyle=Bold
FontColor=120,255,170

[MeterDown]
Meter=String
MeasureName=MeasureIn
Text=▼ %1/s
AutoScale=1
NumOfDecimals=1
X=0r
Y=8R
FontSize=12
FontColor=120,255,170

[MeterUp]
Meter=String
MeasureName=MeasureOut
Text=▲ %1/s
AutoScale=1
NumOfDecimals=1
X=100r
Y=0r
FontSize=12
FontColor=255,170,120

[MeterInGraph]
Meter=Line
MeasureName=MeasureIn
AutoScale=1
X=0r
Y=8R
W=200
H=40
LineColor=120,255,170
SolidColor=40,44,58,120

[MeterOutGraph]
Meter=Line
MeasureName=MeasureOut
AutoScale=1
X=0r
Y=4R
W=200
H=40
LineColor=255,170,120
SolidColor=40,44,58,120
