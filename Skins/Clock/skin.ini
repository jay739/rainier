; Rainier example skin: a simple clock.
[Rainier]
Update=1000
BackgroundColor=20,22,30,190
CornerRadius=12
Padding=16

[Variables]
Accent=120,200,255

[MeasureTime]
Measure=Time
Format=%H:%M:%S

[MeasureDate]
Measure=Time
Format=%A, %B %d

[MeterTime]
Meter=String
MeasureName=MeasureTime
FontSize=34
StringStyle=Bold
FontColor=#Accent#

[MeterDate]
Meter=String
MeasureName=MeasureDate
X=0r
Y=4R
FontSize=13
FontColor=200,205,215
