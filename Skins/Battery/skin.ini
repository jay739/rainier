; Rainier example skin: battery status.
[Rainier]
Update=5000
BackgroundColor=20,22,30,190
CornerRadius=12
Padding=16

[MeasurePercent]
Measure=Battery
Type=Percent

[MeasureState]
Measure=Battery
Type=Charging

[MeterLabel]
Meter=String
MeasureName=MeasurePercent
MeasureName2=MeasureState
Text=Battery  %1%  ·  [MeasureState]
FontSize=13
FontColor=230,230,235

[MeterBar]
Meter=Bar
MeasureName=MeasurePercent
X=0r
Y=6R
W=170
H=8
BarColor=120,255,170
SolidColor=60,65,80,120
